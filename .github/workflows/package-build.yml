name: Build Python packages

on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/package-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build packages (sdist + wheel)
        run: |
          set -euo pipefail
          for pkg in backend/interpy_synth backend/interpy_bg backend/fivedreg_tf; do
            echo "Building $pkg"
            (cd "$pkg" && rm -rf dist && python -m build --sdist --wheel --no-isolation)
          done

      - name: Twine check
        run: |
          set -euo pipefail
          for pkg in backend/interpy_synth backend/interpy_bg backend/fivedreg_tf; do
            twine check "$pkg"/dist/*
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dists
          path: |
            backend/interpy_synth/dist/*
            backend/interpy_bg/dist/*
            backend/fivedreg_tf/dist/*
