name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Run backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/docs/requirements.txt
          pytest backend/tests

      - name: Build packages
        run: |
          set -euo pipefail
          for pkg in backend/interpy_synth backend/interpy_bg backend/fivedreg_tf; do
            echo "Building $pkg"
            (cd "$pkg" && rm -rf dist && python -m build --sdist --wheel --no-isolation)
          done

      - name: Twine check
        run: |
          set -euo pipefail
          for pkg in backend/interpy_synth backend/interpy_bg backend/fivedreg_tf; do
            twine check "$pkg"/dist/*
          done

      - name: Require PyPI token for release publish
        if: github.event_name == 'release' && github.event.action == 'published'
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "PYPI_TOKEN secret is required to publish." >&2
            exit 1
          fi

      - name: Generate changelog
        run: |
          git log -10 --pretty=format:"- %s (%h)" > CHANGELOG_AUTOGEN.md
          cat CHANGELOG_AUTOGEN.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: |
            backend/interpy_synth/dist/*
            backend/interpy_bg/dist/*
            backend/fivedreg_tf/dist/*
            CHANGELOG_AUTOGEN.md

      - name: Publish to PyPI
        if: ${{ env.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/interpy_synth/dist
          skip-existing: true
          password: ${{ env.PYPI_TOKEN }}

      - name: Publish to PyPI (interpy_bg)
        if: ${{ env.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/interpy_bg/dist
          skip-existing: true
          password: ${{ env.PYPI_TOKEN }}

      - name: Publish to PyPI (fivedreg_tf)
        if: ${{ env.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/fivedreg_tf/dist
          skip-existing: true
          password: ${{ env.PYPI_TOKEN }}
