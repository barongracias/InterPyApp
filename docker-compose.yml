services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: interpyapp-backend:latest
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/outputs_numpy:/app/outputs_numpy
      - ./backend/outputs_tf:/app/outputs_tf
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: interpyapp-frontend:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000   # browser calls
      - API_URL=http://backend:8000               # server-side calls
    depends_on:
      - redis
      - backend

  worker:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: interpyapp-backend:latest
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - QUEUE_NAME=train
    command: ["python", "worker.py"]
    depends_on:
      - redis
    volumes:
      - ./backend/outputs_numpy:/app/outputs_numpy
      - ./backend/outputs_tf:/app/outputs_tf
      - ./backend/uploads:/app/uploads
